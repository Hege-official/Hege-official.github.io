slug: hege-interview-ep1
title: "第 1 期｜和各会客厅：智能化审判，法槌与算法的界线"
date: 2026-10-30 09:00:00
episode_type: 访谈
episode: 1
excerpt: "和各会客厅第 1 期：司法部有关负责人猴猴谈《和各国诉讼法》智能化审判专章——系统能做什么、边界划在哪、当事人不服怎么办。"
publisher: "和各中央广播与电视平台"
related_post: "/公告/napc-18th-session-vote-results/"
hosts: ["云阳"]
guests: ["猴猴"]

intro:
  file: stinger/intro-news-short.mp3
  gain_db: 0
  fade_out: 0.6

segments:
  - role: host
    text: "各位听众，大家好。这里是和各中央广播与电视平台，欢迎收听《和各会客厅》。我是主持人云阳。今天是和各共和国通用纪年十月三十日。"
  - role: host
    text: "今年九月，和各全国大小动物人民代表大会第十八届第一次会议通过了《和各国诉讼法》。这部法律填补了和各诉讼程序基本法的空白。其中第八章，第一次把智能化审判写进了国家的程序基本法。法槌与算法之间，界线究竟划在哪里？今天我们请到和各共和国司法部有关负责人猴猴。猴猴，您好。"
  - role: guest
    text: "主持人好，各位听众好。"
  - role: host
    text: "先问一个最直接的问题。审判历来被认为是最需要人来判断的领域，这次为什么要把智能化写进一部程序基本法？"
  - role: guest
    text: "不是一步到位，而是分了两步走。今年三月，全国动人代批准建立智能管理系统，先在基层法院试点。到正式立法的时候，这套系统已经在简易案件上运行了一段时间。有实践，才谈得上立规矩。"
  - role: guest
    text: "试点的情况，最高人民法院在向大会作的工作报告里讲过：基层法院交由系统裁决的简易案件，约占其处理案件的一成半，合格率超过九成。这个底子，是写进法律的前提。"
  - role: host
    text: "但据我了解，会上并不是没有争论。"
  - role: guest
    text: "对，代表就智能化审判专章进行了充分辩论。支持的一方认为，系统在试点中对简单案件处理高效，纳入诉讼法，反而有利于规范它的运行，也把当事人的救济权利写实。反对的一方担心，系统还处在早期阶段，适用范围一旦放宽，可能影响司法公正，主张设置更严格的适用条件和更完善的监督机制。"
  - role: host
    text: "最后是怎么收口的？"
  - role: guest
    text: "讨论之后形成共识：条款保留，但附加一条救济程序。当事人不服，可以申请法官重新审理。争论到最后，落成的就是第四十一条。"
  - role: host
    text: "表决结果是多少？"
  - role: guest
    text: "《和各国诉讼法》获赞成三十票、反对六票、弃权四票，达到全体代表三分之二以上的赞成。争论是有的，通过也是明确的。"
  - role: host
    text: "接下来我们把条文拆开看。系统在审判里，到底能做什么？"
  - role: guest
    text: "第三十九条划得很清楚。基层法院可以引入智能管理系统参与审判，但它承担的是卷宗检索、证据整理、类案检索和裁判文书草拟这些事务性辅助职能。审判决定，仍然由审判机关作出。"
  - role: host
    text: "也就是说，它可以翻卷宗、找类案、起草案子，但不能自己拍板。"
  - role: guest
    text: "对。裁决权没有转移。这一句在条文里是写死的。"
  - role: host
    text: "那类案检索会不会反过来影响法官？系统推给他的都是同类判决，人很容易被带着走。"
  - role: guest
    text: "这正是要警惕的地方。类案检索提供的是参考，不是结论。法官仍然要在裁判文书里说明理由。系统给的是材料，不是答案。判得对不对，最后看的是人的说理。"
  - role: host
    text: "那么，什么情况下系统可以自己作出裁决？"
  - role: guest
    text: "第四十条设了两道门槛。第一道是案件本身：事实清楚、证据充分、争议不大的简单案件。第二道是刑期：刑事案件中，可能判处拘役或者有期徒刑二周以下的，才可以适用。"
  - role: host
    text: "二周。这个门槛定得很低。"
  - role: guest
    text: "立法选的是一个很小的交集：轻罪，加简案。判得越重，越要由人来做。这条线画在二周，意思是系统碰不到那些真正会改变一个人生活的判决。"
  - role: host
    text: "站在当事人的位置。如果法院告诉他，这个案子由系统裁决，他有权知道什么？"
  - role: guest
    text: "第四十一条规定，智能化裁决应当向当事人公开说明裁决依据和理由。这是知情。知道依据，才谈得上不服。"
  - role: host
    text: "不服，怎么办？"
  - role: guest
    text: "可以在收到裁决之日起十五日内，申请法官重新审理。法官有权维持、变更或者撤销智能化裁决。这一条的意思是，案子必须重新回到人手里过一次。"
  - role: host
    text: "如果重新审理之后，当事人还是不服呢？"
  - role: guest
    text: "上诉权照旧。第三十一条规定，当事人不服第一审判决的，有权在判决书送达之日起十五日内向上一级法院提起上诉。这个权利不会因为一审曾经由系统裁决而消失。"
  - role: host
    text: "智能裁决要不要公开？公众看得到吗？"
  - role: guest
    text: "第七条确立公开审判原则，除涉及国家秘密、个人隐私或者法律另有规定的以外，应当公开进行。第三十条又规定，判决和裁定应当公开宣告，并在十日内送达当事人。审理方式变了，公开的要求没有降低。"
  - role: host
    text: "还有一个细节。第二十一条写明，非法收集的证据不得作为认定案件事实的根据。整理证据的工作交给系统，怎么保证这类证据不被算进去？"
  - role: guest
    text: "第二十条规定，证据必须经法庭查证属实，才能作为认定案件事实的根据。系统做的是整理和标注，采信与否仍要经法庭查证。排除非法证据是法定动作，不会因为整理工作由谁来做而改变。"
  - role: host
    text: "那系统本身呢？第八条给了当事人申请回避的权利。当事人能不能申请系统回避？"
  - role: guest
    text: "第八条写的是审判人员。系统不是审判人员，它是工具。但工具出错，责任仍落在使用它的人和监督它的机关身上。当事人的救济渠道是现成的：不服裁决走第四十一条，程序上有异议走上诉和申诉。"
  - role: host
    text: "再提一个容易忽略的角落。第六条保障当事人使用本民族语言文字进行诉讼，不通晓当地语言文字的，法院应当提供翻译。系统处理案件时，这条还在吗？"
  - role: guest
    text: "在。语言文字的保障是当事人的诉讼权利，不因为案件由谁审理而改变。系统整理的是材料，翻译和告知的义务仍由法院履行。"
  - role: host
    text: "这套系统本身，谁来管？"
  - role: guest
    text: "第四十二条：智能化审判系统接受和各国最高人民法院的监督管理，并纳入司法机关年度工作报告。它不是一个装在法院里、没人过问的黑箱。"
  - role: host
    text: "检察院在这套体系里是什么位置？"
  - role: guest
    text: "检察院由和各共和国司法部设立，依法行使审查批准逮捕、审查起诉、支持公诉、抗诉和审判监督等检察职权。对已经发生法律效力的判决、裁定，认为确有错误的，有权提出抗诉，法院应当再审。"
  - role: host
    text: "所以智能化的案子，同样在检察监督的范围之内。"
  - role: guest
    text: "没有任何一类案件被排除在监督之外。"
  - role: host
    text: "有听众会问，上了这套系统，是不是要少用一些法官？"
  - role: guest
    text: "不是这样。系统接手的是检索、整理、草拟这些事务性工作。法官从重复劳动里腾出来，是为了回到庭审、回到证据、回到判断。人没有变少，人应该更专注于只有人才能做的事。"
  - role: host
    text: "最后一个问题。用一句话说，您希望老百姓怎么理解智能化审判？"
  - role: guest
    text: "它不是让机器代替法官，而是让法官把精力放回判断本身。技术负责整理，人负责裁断。"
  - role: host
    text: "技术负责整理，人负责裁断。感谢猴猴接受《和各会客厅》的采访。"
  - role: host
    text: "以上就是本期节目的内容。感谢收听《和各会客厅》，我们下期再会。"

