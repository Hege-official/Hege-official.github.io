segments:
  - role: host
    text: "各位好，这里是和各中央广播与电视平台，欢迎收听《和各会客厅》。我是云阳。今天是十月三十号。"
  - role: host
    text: "开场先说个事儿。上个月有个朋友问我，听说现在法院判案子可以用人工智能了，是真的吗。我说是真的，但跟你想的不太一样。今天请到和各共和国司法部有关负责人猴猴。猴猴，你好。"
  - role: guest
    text: "你好。问的人不少，十个里有八个以为是机器坐在审判席上直接判。"
  - role: host
    text: "那咱们从头说。审判这个事，一直被当成最需要人来判断的。这部诉讼法是你们部起草的？为什么要把智能化写进去？"
  - role: guest
    text: "法案是我们起草，报大会审的。不过这套系统不是一天冒出来的。它最早是给档案库做辅助编辑、格式校验的，今年三月大会才批准正式建立。法院那边是另外试的，公开材料里没写清哪一天开始、试了多久。到九月十六号，才写进诉讼法。"
  - role: host
    text: "那法院试下来效果怎么样？"
  - role: guest
    text: "最高人民法院向大会作报告时给过一组数：基层法院交给系统裁决的简易案件，占它处理案件的一成半左右，合格率九成二。这个数不算惊艳，但也不算差。"
  - role: host
    text: "九成二。剩下那八分怎么算不合格？"
  - role: guest
    text: "公开的数字只有这两个，没细分。那八分里到底是什么情况，没人拆开讲过。我现在只能说，它还不能独立判。"
  - role: host
    text: "会上有没有人反对？"
  - role: guest
    text: "有代表担心。原话大意是，这东西还处在早期，范围一放宽就可能影响公正，主张把适用条件卡得更死，监督机制也得跟上。写进法律的时候，就是照这个方向收的口子。"
  - role: host
    text: "最后怎么定的？"
  - role: guest
    text: "条款留着，但加了一条救济：当事人不服，可以申请法官重新审理。这条后来就是第四十一条。"
  - role: host
    text: "表决多少票？"
  - role: guest
    text: "三十票赞成，六票反对，四票弃权。三分之二以上，过了。"
  - role: host
    text: "好，那咱们把条文拆开。系统在里头到底干什么活？"
  - role: guest
    text: "说白了就是打杂。卷宗检索、证据整理，剩下那些也都是事务性的。审判决定还是审判机关作。"
  - role: host
    text: "就是它能翻卷宗、找同类案子、起草文书，但不能自己拍板。"
  - role: guest
    text: "对，不能。"
  - role: host
    text: "我有个疑问。类案检索这个功能，推给法官的都是同类判决，人会不会被带着走？"
  - role: guest
    text: "会。这是真问题，我不打算说不会。所以法条要求法官说明裁判理由，系统给的是材料，不是结论。"
  - role: host
    text: "那法官怎么办？照着推的判，还是干脆不看？"
  - role: guest
    text: "两条都不对。推来的东西，得自己去核；核完采不采、怎么采，得写进理由里。这一条其实是给法官加活的。"
  - role: host
    text: "什么案子能交给它判？"
  - role: guest
    text: "两道门槛。案子本身得是事实清楚、证据充分、争议不大的简单案件。刑事案件还多一道：可能判拘役，或者有期徒刑二周以下的，才能用。"
  - role: host
    text: "争议大不大，谁说了算？当事人可能觉得天大。"
  - role: guest
    text: "这是实务里最容易起争执的一处。判断在法院，当事人可以提异议；真争执起来，硬交给系统就不合适了。"
  - role: host
    text: "二周？这也太短了吧。"
  - role: guest
    text: "短。我知道你要问这个。这条线定得保守，是有意的。判得重的，我不敢让它碰。二周以内，多半是关几天就出来的案子，本身也不复杂。"
  - role: host
    text: "那民事、行政的案子呢？"
  - role: guest
    text: "那道刑期门槛只针对刑事案件。民事、行政的简单案件，只要符合前面那几个条件，也可以走。"
  - role: host
    text: "举个具体的。什么样的案子会落到系统手上？"
  - role: guest
    text: "通常是钱不多、双方对事实没什么争议的民事纠纷；或者事实清楚、被告人自己也认的小刑事案件。真要是复杂，第一道门槛就过不去。"
  - role: host
    text: "好。假设我就是当事人，法院告诉我这案子是系统判的。我有权知道什么？"
  - role: guest
    text: "得向你公开说明裁决依据和理由。你知道它凭什么这么判，才谈得上服不服。"
  - role: host
    text: "法院会主动告诉当事人，这案子是系统判的吗？"
  - role: guest
    text: "得告诉。不告诉，那条救济就是空的——你连不服什么都不知道。"
  - role: host
    text: "我不服呢？"
  - role: guest
    text: "收到裁决之日起十五天内，可以申请法官重新审理。法官可以维持，可以改，也可以撤。等于这个案子必须回到人手上再过一遍。"
  - role: host
    text: "这跟上诉是一回事吗？"
  - role: guest
    text: "不是。重审还在原来那级法院，由法官把案子重新看一遍。上诉是到上一级法院去。"
  - role: host
    text: "重新审完还是不服？"
  - role: guest
    text: "条文没写这么细。按第三十一条，一审判决不服能上诉，重审完了应该也走这条路。"
  - role: host
    text: "公开呢？系统判的案子，旁听的人能听到什么？"
  - role: guest
    text: "公开审判是原则，除了涉及国家秘密、个人隐私这些例外，都应当公开。判决裁定还得公开宣告，十天内送达当事人。审的方式变了，公开这一条没松。"
  - role: host
    text: "再问个细的。非法收集的证据不能用。证据整理交给系统，它会不会把不该用的也整理进去？"
  - role: guest
    text: "整理和采信是两回事。证据必须经法庭查证属实，才能作为认定事实的根据。系统整理得再整齐，采不采还得法庭说了算。非法证据排除是法定动作，不会因为整理的人换成了机器就免了。"
  - role: host
    text: "那系统本身能不能被要求回避？第八条给了当事人申请回避的权利。"
  - role: guest
    text: "回避这条写的是审判人员。工具不是审判人员，所以套不上它。当事人不服，还是走第四十一条。"
  - role: host
    text: "还有个容易被忽略的。当事人有权用本民族语言文字打官司，不懂当地语言的，法院要给翻译。系统办案，这条还在吗？"
  - role: guest
    text: "在。语言权利是当事人的诉讼权利，不因为谁来审就变。系统整理是材料，翻译和告知还是法院的义务。"
  - role: host
    text: "系统本身谁管？"
  - role: guest
    text: "它接受最高人民法院监督管理，还要写进司法机关年度工作报告。不是装在法院里没人过问的东西。"
  - role: host
    text: "检察院呢？"
  - role: guest
    text: "检察院是司法部设立的，审查批准逮捕、审查起诉、支持公诉、抗诉、审判监督，都是它的职权。判决裁定生效了，认为确有错误，可以抗诉，法院应当再审。"
  - role: host
    text: "也就是说，系统判的案子，检察院照样能抗诉。"
  - role: guest
    text: "对，照样能。"
  - role: host
    text: "最后一个问题，也是很多听众关心的：上了这套系统，法官是不是要少用了？"
  - role: guest
    text: "检索、整理、草拟这些活它干了。法官省下来的时间干什么，我不好替所有法院回答。至于人少不少，那是编制的事，跟这套系统是两码事。"
  - role: host
    text: "那我再问个不太好答的。这套东西，你觉得哪块还没想清楚？"
  - role: guest
    text: "嗯，说实话，系统出错以后怎么追责，条文写得比较原则。第四十一条管的是裁决本身，第四十二条管的是监督，但一个整理环节出了纰漏、最后影响了判断，这个责任怎么落，细则还没出。这块我不回避。"
  - role: host
    text: "行，今天就聊到这儿。细则没出来之前，案子还得一件件判。感谢猴猴。"
  - role: guest
    text: "谢谢。"
  - role: host
    text: "以上就是本期《和各会客厅》。感谢收听，我们下期再会。"

