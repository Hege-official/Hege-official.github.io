name: Build and Deploy Jekyll Site

on:
  push:
    branches:
      - main  # 监听 main 分支的提交

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub runner 无法访问 gems.ruby-china.com（TLS 握手失败），CI 改用官方源
      GEM_SOURCE: "https://rubygems.org/"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'  # 指定 Ruby 版本（需与 Jekyll 4.4.1 兼容）

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll Site
        run: |
          bundle exec jekyll build --trace

      - name: Verify Build Output
        run: |
          set -e
          for page in index.html news/index.html notices/index.html editorials/index.html feedback/index.html archive/index.html search/index.html 404.html; do
            if [ ! -s "_site/$page" ]; then
              echo "::error::缺少或为空的构建产物: _site/$page"
              exit 1
            fi
          done
          echo "构建产物检查通过（关键页面均已生成）"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site  # Jekyll 构建输出目录
